<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		*, *::before, *::after {
			--fntfam1: "Libre Franklin", Helvetica, Arial, Verdana, sans-serif;
			--fntfam2: "Century-Light", serif;
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			/* outline: 1px solid red; */
			line-height: 1.1;
			font-family: var(--fntfam1);
		}
		html {
			/* padding: 0.5rem; */
		}
		body {
			background-color: gray;
			color: white;
		}
		.grid {
			display: grid;
			width: 100dvw;
			height: 100dvh;
			grid-template-rows: 4% 94% 2%;
			grid-template-columns: 1fr 10fr 1fr;
			grid-template-areas:
				'H H H'
				'N I I'
				'F F F';
			}
			header {
				grid-area: H;
			}
			header p {
			padding: 0.25rem;
			text-align: center;
			font-size: 18pt;
			font-weight: 800;
			text-transform: uppercase;
		}
		nav {
			grid-area: N;
			background-color: gray;
		}
		iframe {
			grid-area: I;
			width: 100%;
			height: 100%;
		}
		footer {
			grid-area: F;
		}
		nav a {
			padding: 0.125rem;
			display: block;
			width: 100%;
			margin-bottom: 1%;
			text-align: center;
			text-decoration: none;
			background-color: white;
			background-color: gr;
		}
		nav a:hover {
			padding: 0.125rem;
			background-color: blue;
			color: white;
		}
	</style>
</head>
<body class="grid">
	<header><p>Extra Ecclesiam nulla salus</p></header>
	<nav>
		<a href="./template/adds.html" target="iframe">Adds</a>
		<a href="./template/meme.html" target="iframe">Meme</a>
		<a href="./template/prayers.html" target="iframe">Prayers</a>
		<!-- <a href="./"></a> -->
	</nav>
	<iframe src="./template/adds.html" frameborder="0" name="iframe"></iframe>
	<footer></footer>
</body>
</html>
