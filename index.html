<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		*, *::before, *::after {
			--fntfam1: "Libre Franklin", Helvetica, Arial, Verdana, sans-serif;
			--fntfam2: "Century-Light", serif;
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			/* outline: 1px solid red; */
			line-height: 1.1;
			font-family: var(--fntfam1);
		}
		html {
		}
		body {
			background-color: gray;
			color: white;
		}
		.grid {
			display: grid;
			width: 100dvw;
			height: 100dvh;
			grid-template-rows: 4% 3% 92% 1%;
			grid-template-columns: 1% 98% 1%;
			grid-template-areas:
			'H H H'
			'N N N'
			'. I .'
			'F F F';
		}
		header {
			grid-area: H;
		}
		header p {
			padding: 0.25rem;
			text-align: center;
			font-size: 18pt;
			font-weight: 800;
			text-transform: uppercase;
		}
		nav {
			grid-area: N;
			background-color: gray;
			padding-left: 0.125rem;
		}
		iframe {
			grid-area: I;
			width: 100%;
			height: 100%;
		}
		footer {
			grid-area: F;
		}
		nav a {
			padding: 0.125rem;
			display: inline-block;
			width: max-content;
			height: 100%;
			margin-right: 2px;
			text-align: center;
			text-decoration: none;
			background-color: white;
			background-color: gr;
		}
		nav a:hover {
			padding: 0.125rem;
			background-color: blue;
			color: white;
		}
	</style>
</head>
<body class="grid">
	<header><p>Extra Ecclesiam nulla salus</p></header>
	<nav>
		<a href="./template/adds.html" target="iframe">Adds</a>
		<a href="./template/meme.html" target="iframe">Meme</a>
		<a href="./template/prayers.html" target="iframe">Prayers</a>
		<a href="./template/list.html" target="iframe">Lists</a>
		<!-- <a href="./"></a> -->
	</nav>
	<iframe src="./template/prayers.html" frameborder="0" name="iframe"></iframe>
	<footer></footer>
</body>
</html>
